<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PR Tracker · Mail Layout</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  #root { height: 100%; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui-primitives.jsx"></script>
  <script type="text/babel" src="mac-shell.jsx"></script>
  <script type="text/babel" src="feed-lanes.jsx"></script>
  <script type="text/babel" src="pr-detail.jsx"></script>
  <script type="text/babel" src="pr-mail.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="mail" title="PR Tracker · Todo-first Mail layout" subtitle="Every PR is a todo list. Each non-mine message in a thread is a checkbox; the thread resolves when all are checked. New replies re-open resolved threads. Read/unread is gone — completion drives everything.">
            <DCPostIt>
              <b>How to read this:</b> the ring + counter in the source list shows resolved / total threads for each PR. Blue ring = ball in my court. Green check = caught up. Click any checkbox in the detail to mark a reviewer's message addressed; threads auto-collapse into the Resolved section. Try toggling a checkbox in <i>#5107</i> and watch the ring on the left re-fill.
            </DCPostIt>
            <DCArtboard id="mail-attention" label="Awaiting me — #5107 selected" width={1280} height={820}>
              <PRMailApp initialTheme="light" initialFilter="awaiting" initialSelectedId={5107} />
            </DCArtboard>
            <DCArtboard id="mail-all" label="All PRs · Light" width={1280} height={820}>
              <PRMailApp initialTheme="light" initialFilter="all" initialSelectedId={5107} />
            </DCArtboard>
            <DCArtboard id="mail-caughtup" label="Caught up — #5072 selected" width={1280} height={820}>
              <PRMailApp initialTheme="light" initialFilter="done" initialSelectedId={5072} />
            </DCArtboard>
            <DCArtboard id="mail-dark" label="All · Dark" width={1280} height={820}>
              <PRMailApp initialTheme="dark" initialFilter="all" initialSelectedId={5107} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
